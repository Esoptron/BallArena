name: Verify Godot project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified Godot 4.7.2 Standard
        shell: bash
        run: |
          set -euo pipefail
          file=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$file" -o "$RUNNER_TEMP/$file"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $RUNNER_TEMP/$file" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$file" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify runner failure detection
        run: python -m unittest discover -s tests/tooling -v
      - name: Import and run headless regressions
        run: python tools/run_tests.py --suite headless --jobs 2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-verification
          path: builds/qa
          if-no-files-found: ignore
          retention-days: 14
